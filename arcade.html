  var ALL = DATA.all, FEATURED = {};
  DATA.featured.forEach(function (f) { FEATURED[f] = true; });
  var q = document.getElementById("q");
  var hot = document.getElementById("hot");
  var grid = document.getElementById("grid");
  var count = document.getElementById("count");

  function card(g, hotStyle) {
    var a = document.createElement("a");
    a.className = "g" + (hotStyle ? " hot" : "");
    a.href = "arcade/" + encodeURIComponent(g.file);
    a.innerHTML = "<b></b><span></span>";
    a.querySelector("b").textContent = g.name;
    a.querySelector("span").textContent = Math.round(g.size / 1024) + " KB";
    return a;
  }

  function render() {
    var term = q.value.trim().toLowerCase();
    hot.innerHTML = ""; grid.innerHTML = "";
    var hotN = 0, allN = 0;
    ALL.forEach(function (g) {
      var match = !term || g.name.toLowerCase().indexOf(term) >= 0 || g.file.toLowerCase().indexOf(term) >= 0;
      if (FEATURED[g.file]) {
        if (!match) return;
        hot.appendChild(card(g, true)); hotN++;
      } else {
        if (!match) return;
        grid.appendChild(card(g, false)); allN++;
      }
    });
    document.querySelector(".sec-title h2").textContent = "🎯 不用看字（" + hotN + "）";
    count.textContent = term ? "搜索「" + term + "」找到 " + allN + " 款" : "共 " + allN + " 款";
  }
  q.addEventListener("input", render);
  render();
})();
