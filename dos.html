<script>try{var m=localStorage.getItem("theme")||"system";var d=m==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):m;document.documentElement.dataset.theme=d;}catch(e){}</script>
<style>
.dos-shell{max-width:720px;margin:0 auto}
.picker{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pick{
  display:flex;flex-direction:column;gap:2px;padding:10px 16px;border-radius:12px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);
  font:600 13px/1.2 inherit;text-align:left;transition:background .15s,border-color .15s,transform .15s;
}
.pick small{font-size:10.5px;color:var(--muted);font-weight:500}
.pick:hover{background:rgba(255,255,255,.11);transform:translateY(-1px)}
.pick.active{border-color:rgba(251,113,133,.6);background:rgba(251,113,133,.14)}
html[data-theme="light"] .pick{background:#fff;border-color:rgba(0,0,0,.1)}
html[data-theme="light"] .pick:hover{background:#fff}
#dos{
  width:100%;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);box-shadow:0 24px 60px -30px rgba(0,0,0,.9);
}
#dos canvas{width:100%!important;height:100%!important;display:block;image-rendering:pixelated}
.dos-status{margin-top:12px;font-size:12.5px;color:var(--muted);min-height:18px}
.touch{margin-top:16px;display:none;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
body.touch-on .touch{display:flex}
.tp{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:6px}
.tp button{border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.09);color:#fff;font-size:18px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.tp button:active{background:rgba(255,80,80,.5)}
.tp .u{grid-column:2;grid-row:1}.tp .l{grid-column:1;grid-row:2}.tp .r{grid-column:3;grid-row:2}.tp .d{grid-column:2;grid-row:3}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts button{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(251,113,133,.2);color:#fff;font-size:13px;font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.acts button:active{background:rgba(251,113,133,.55)}
.acts .small{width:auto;height:42px;border-radius:11px;padding:0 14px;font-size:12px}
.legal{max-width:720px;margin:22px auto 0;font-size:12px;color:var(--muted);line-height:1.7}
</style>
<link rel="stylesheet" href="skins.css?v=1">
<link rel="stylesheet" href="splash.css?v=1">
</head>
<body>
<div class="orbs" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>

    <button class="theme-btn" type="button" aria-label="切换主题">☀️</button>
  </div>

<header class="hero-home" style="padding-bottom:18px">
  <p class="eyebrow">DOS GAMES</p>
  <h1>DOS 时代的<em>真游戏</em></h1>
  <p class="lead">原版游戏文件 + DOSBox 模拟器，共享版可自由分发。不是复刻，是当年那个东西。</p>
</header>

<main>
  <div class="dos-shell">
    <div class="picker" id="picker"></div>
    <div id="dos"></div>
    <p class="dos-status" id="dosStatus">正在加载…</p>

    <div class="touch">
      <div class="tp">
        <button data-key="ArrowUp" type="button">▲</button>
        <button data-key="ArrowLeft" type="button">◀</button>
        <button data-key="ArrowRight" type="button">▶</button>
        <button data-key="ArrowDown" type="button">▼</button>
      </div>
      <div class="acts">
        <button data-key="ControlLeft" type="button">开火</button>
        <button data-key="Space" type="button">开门</button>
        <button data-key="Enter" class="small" type="button">确认</button>
        <button data-key="Escape" class="small" type="button">菜单</button>
      </div>
    </div>

    <p class="legal" id="legal"></p>
  </div>
</main>

<footer>
  <p>口袋小站 · DOS 游戏合集</p>
  <p class="muted">DOSBox-WASM · 本地运行 · 共享版</p>
</footer>

<script src="js-dos/js-dos.js"></script>
<script>
(function () {
  var GAMES = {
    doom:    { name: "DOOM",    icon: "👹", sub: "2.1MB · 射击", bundle: "doom.jsdos",    legal: "DOOM 共享版（Episode 1: Knee-Deep in the Dead）由 id Software 发布并允许自由分发。" },
    heretic: { name: "Heretic", icon: "🧙", sub: "2.6MB · 奇幻射击", bundle: "heretic.jsdos", legal: "Heretic 共享版由 Raven Software / id Software 发布，允许自由分发。" },
    hexen:   { name: "Hexen",   icon: "⚔️", sub: "5.4MB · 动作", bundle: "hexen.jsdos",   legal: "Hexen 试玩版（demo）由 Raven Software 发布，允许自由分发。" },
    jazz:    { name: "Jazz Jackrabbit", icon: "🐰", sub: "1.4MB · 横版跑酷", bundle: "jazz.jsdos", legal: "Jazz Jackrabbit 共享版由 Epic MegaGames 发布，允许自由分发。" },
    wolf3d:  { name: "Wolfenstein 3D", icon: "🪖", sub: "0.7MB · 射击", bundle: "wolf3d.jsdos", legal: "Wolfenstein 3D 共享版由 id Software 发布，允许自由分发。" }
  };

  var params = new URLSearchParams(location.search);
  var id = params.get("g") || "doom";
  if (!GAMES[id]) id = "doom";
  var game = GAMES[id];

  // 选择器
  var picker = document.getElementById("picker");
  Object.keys(GAMES).forEach(function (key) {
    var g = GAMES[key];
    var b = document.createElement("button");
    b.className = "pick" + (key === id ? " active" : "");
    b.type = "button";
    b.innerHTML = "<span>" + g.icon + " " + g.name + "</span><small>" + g.sub + "</small>";
    b.addEventListener("click", function () {
      if (key === id) return;
      location.href = "dos.html?g=" + key;
    });
    picker.appendChild(b);
  });

  document.title = game.name + " · 口袋小站";
  document.getElementById("legal").textContent = "版权说明：" + game.legal;
  var status = document.getElementById("dosStatus");

  window.addEventListener("error", function (e) {
    if (status) status.textContent = "出错：" + (e.message || "未知") + "（刷新可重试）";
  });
  window.addEventListener("unhandledrejection", function (e) {
    if (status) status.textContent = "出错：" + ((e.reason && e.reason.message) || e.reason) + "（刷新可重试）";
  });

  if (!window.Dos) { status.textContent = "模拟器脚本加载失败"; return; }
  try {
    Dos(document.getElementById("dos"), {
      url: game.bundle + "?v=1",
      pathPrefix: "js-dos/emulators/",
      theme: "dark",
      autoStart: true,
      onEvent: function (ev) {
        if (ev === "ci-ready") status.textContent = "启动中…";
        if (ev === "exit") status.textContent = "游戏已退出";
      }
    });
    status.textContent = "加载 " + game.name + "…（首次约 " + game.sub.split(" ")[0] + "，之后走缓存）";
  } catch (e) {
    status.textContent = "启动失败：" + e.message;
  }

  // 触屏键
  if ("ontouchstart" in window || navigator.maxTouchPoints > 0) document.body.classList.add("touch-on");
  var map = {
    ArrowUp: { key: "ArrowUp", kc: 38 }, ArrowDown: { key: "ArrowDown", kc: 40 },
    ArrowLeft: { key: "ArrowLeft", kc: 37 }, ArrowRight: { key: "ArrowRight", kc: 39 },
    ControlLeft: { key: "Control", kc: 17 }, Space: { key: " ", kc: 32 },
    Enter: { key: "Enter", kc: 13 }, Escape: { key: "Escape", kc: 27 }
  };
  function fire(code, down) {
    var m = map[code]; if (!m) return;
    var ev = new KeyboardEvent(down ? "keydown" : "keyup", { key: m.key, code: code, keyCode: m.kc, which: m.kc, bubbles: true, cancelable: true });
    document.dispatchEvent(ev); window.dispatchEvent(ev);
  }
  document.querySelectorAll("[data-key]").forEach(function (b) {
    var code = b.dataset.key;
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); fire(code, true); });
    b.addEventListener("pointerup", function (e) { e.preventDefault(); fire(code, false); });
    b.addEventListener("pointerleave", function () { fire(code, false); });
    b.addEventListener("pointercancel", function () { fire(code, false); });
  });
})();
</script>
<script src="theme.js"></script>
<script src="skin.js"></script>
</body>
