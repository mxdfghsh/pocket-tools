<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="description" content="口袋工具箱 —— 纯前端、离线可用的常用小工具合集：Base64、时间戳、JSON、哈希、密码、UUID、文本统计、颜色转换。">
<title>口袋工具箱 · Pocket Tools</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="orbs" aria-hidden="true">
  <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
</div>

<header class="hero">
  <nav class="brand">
    <span class="brand-ico">🧰</span>
    <span class="brand-name">口袋工具箱</span>
    <span class="brand-tag">Pocket Tools</span>
  </nav>

  <h1>把常用的小工具，<em>装进口袋</em></h1>
  <p class="sub">纯前端实现 · 零依赖 · 离线可用 —— 所有计算都在你的浏览器里完成，数据不出本机。</p>

  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
    <input id="q" type="search" placeholder="搜索工具，例如 时间戳 / base64 / 密码" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
  </div>

  <div class="pills">
    <span class="pill" id="stat-count">9 个工具</span>
    <span class="pill">0 依赖</span>
    <span class="pill">100% 本地计算</span>
  </div>
</header>

<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <span>🔍</span>
    <p>没有找到匹配的工具，换个关键词试试？</p>
  </div>
</main>

<footer>
  <p>口袋工具箱 · 纯静态页面，可离线运行</p>
  <p class="muted">所有输入内容不会离开你的设备，刷新即消失。</p>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
<script src="extra.js"></script>
</body>
</html>
