<!doctype html>
<link rel="stylesheet" href="motion.css?v=3">
<link rel="stylesheet" href="pc.css?v=2">
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<title>中转站测试 · 月临汐岸</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
<style>
:root{--bg:#0b0f19;--line:rgba(255,255,255,.1);--text:#e8edf7;--muted:#8a95ab;--accent:#6ee7ff;--accent2:#a78bfa;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,rgba(110,231,255,.14),transparent 60%),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 140px}
h1{font-size:18px;margin:6px 0 4px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.cfg{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.cfg label{display:block;font-size:11.5px;color:var(--muted);margin:8px 0 5px;letter-spacing:.3px}
.cfg input{width:100%;font:12.5px var(--mono);color:var(--text);background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:0}
.cfg input:focus,.cfg select:focus{border-color:rgba(110,231,255,.45)}
.cfg select{width:100%;font:12.5px var(--mono);color:var(--text);background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:0}
.cfg .row{display:flex;gap:9px}
.cfg .row>div{flex:1}
.cfg small{color:#5f6b81;font-size:11px;display:block;margin-top:6px}
#log{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(110,231,255,.22),rgba(167,139,250,.22));border:1px solid rgba(110,231,255,.3)}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.msg.sys{align-self:center;background:rgba(251,113,133,.14);border:1px solid rgba(251,113,133,.35);color:#ffc9d2;font-family:var(--mono);font-size:12px;max-width:100%}
.composer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,#0b0f19 60%,rgba(11,15,25,.85));border-top:1px solid var(--line)}
.composer .box{max-width:760px;margin:0 auto;display:flex;gap:9px}
.composer textarea{flex:1;resize:none;height:46px;font:14px var(--mono);color:var(--text);background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:12px;outline:0}
.composer button{padding:0 20px;border:0;border-radius:12px;font:700 14px inherit;color:#04121a;background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer}
.composer button:disabled{opacity:.45;cursor:default}
.err{color:#ffc9d2}
@media(max-width:560px){.wrap{padding-bottom:150px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛰️ 中转站测试</h1>
  <p class="sub">浏览器里直接调你的中转站，验证能不能通。口令只存在本机浏览器，不会上传。</p>

  <div class="cfg">
    <label>厂商</label>
    <select id="prov">
      <option value="zhipu">智谱 GLM</option>
      <option value="openai">OpenAI</option>
      <option value="claude">Claude</option>
      <option value="gemini">Gemini</option>
      <option value="deepseek">DeepSeek</option>
      <option value="qwen">通义千问</option>
      <option value="moonshot">Kimi</option>
    </select>
    <label>Base URL</label>
    <input id="base" value="https://relay.3498341186.workers.dev/zhipu" spellcheck="false">
    <label>访问口令（不是真 key）</label>
    <input id="token" placeholder="填你中转站的口令" spellcheck="false" autocomplete="off">
    <div class="row">
      <div><label>模型</label><input id="model" value="glm-4-flash" spellcheck="false"></div>
    </div>
    <small>填完直接发消息即可；配置会自动保存在本机浏览器</small>
  </div>

  <div id="log"></div>
</div>

<div class="composer">
  <div class="box">
    <textarea id="input" placeholder="说点什么…（Enter 发送）"></textarea>
    <button id="send">发送</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), sendBtn = $("send");
  const baseI = $("base"), tokenI = $("token"), modelI = $("model"), provI = $("prov");
  const store = {
    get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  const ORIGIN = "https://relay.3498341186.workers.dev";
  const MODEL_DEFAULT = { zhipu: "glm-4-flash", openai: "gpt-4o-mini", claude: "claude-3-5-haiku-latest", gemini: "gemini-2.0-flash", deepseek: "deepseek-chat", qwen: "qwen-plus", moonshot: "moonshot-v1-8k" };

  baseI.value = store.get("relay.base", baseI.value);
  provI.value = store.get("relay.prov", "zhipu");
  provI.addEventListener("change", () => {
    baseI.value = ORIGIN + "/" + provI.value;
    modelI.value = MODEL_DEFAULT[provI.value] || modelI.value;
    saveCfg();
  });
  tokenI.value = store.get("relay.token", "");
  modelI.value = store.get("relay.model", "glm-4-flash");

  const saveCfg = () => {
    store.set("relay.base", baseI.value.trim());
    store.set("relay.token", tokenI.value.trim());
    store.set("relay.model", modelI.value.trim());
    store.set("relay.prov", provI.value);
  };
  [baseI, tokenI, modelI].forEach((n) => n.addEventListener("change", saveCfg));

  const add = (cls, text) => {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    log.appendChild(d);
    d.scrollIntoView({ block: "end" });
    return d;
  };

  let busy = false;
  const messages = [];

  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = "";
    saveCfg();

    const base = baseI.value.trim().replace(/\/+$/, "");
    const token = tokenI.value.trim();
    const model = modelI.value.trim() || "glm-4-flash";

    add("user", text);
    messages.push({ role: "user", content: text });

    const bot = add("bot", "…");
    busy = true; sendBtn.disabled = true;

    try {
      const r = await fetch(base + "/chat/completions", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: "Bearer " + token },
        body: JSON.stringify({ model, messages, stream: true }),
      });

      if (!r.ok) {
        const t = await r.text();
        bot.remove();
        add("sys", "HTTP " + r.status + "\n" + t.slice(0, 600));
        return;
      }

      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "", acc = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split("\n");
        buf = parts.pop();
        for (const line of parts) {
          const s = line.trim();
          if (!s.startsWith("data:")) continue;
          const data = s.slice(5).trim();
          if (!data || data === "[DONE]") continue;
          try {
            const j = JSON.parse(data);
            const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if (delta) { acc += delta; bot.textContent = acc; }
          } catch (e) {}
        }
      }
      if (!acc) bot.textContent = "（没有返回内容）";
      messages.push({ role: "assistant", content: acc });
    } catch (e) {
      bot.remove();
      add("sys", "请求失败：" + e.message + "\n\n可能是：口令不对 / base URL 写错 / 网络到不了中转站");
    } finally {
      busy = false; sendBtn.disabled = false; input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
})();
</script>
<script src="motion.js?v=3"></script>
</body>
</html>
