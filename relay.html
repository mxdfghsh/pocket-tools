<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>模型检测 · 口袋小站</title>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">

<script>try{var m=localStorage.getItem("theme")||"system";var d=m==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):m;document.documentElement.dataset.theme=d;}catch(e){}</script>
<style>
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
.box{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
html[data-theme="light"] .box{background:#fff;border-color:rgba(0,0,0,.09)}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
input,textarea{width:100%;font:13px var(--mono,monospace);color:var(--text);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:11px;padding:12px;outline:0;resize:vertical}
html[data-theme="light"] input,html[data-theme="light"] textarea{background:#f8fafc;border-color:rgba(0,0,0,.12)}
input:focus,textarea:focus{border-color:rgba(110,231,255,.5)}
#go{width:100%;margin-top:14px;padding:15px;border-radius:13px;border:0;cursor:pointer;font:800 15px/1 inherit;color:#04121a;background:linear-gradient(135deg,var(--accent),var(--accent2))}
#go:disabled{opacity:.5}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:18px}
.m{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:rgba(255,255,255,.03);font-size:13px}
html[data-theme="light"] .m{background:#fbfcff}
.m .ico{font-size:16px;line-height:1.2}
.m .body{flex:1;min-width:0}
.m .name{font-weight:700;font-family:var(--mono,monospace);word-break:break-all}
.m .meta{font-size:11.5px;color:var(--muted);margin-top:3px;font-family:var(--mono,monospace)}
.m .txt{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m.ok{border-color:rgba(52,211,153,.35)}
.m.bad{border-color:rgba(251,113,133,.35)}
.m.wait{border-color:rgba(251,191,36,.3);opacity:.75}
.sum{font-size:13px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>
<nav class="nav">
  <a class="nav-brand" href="./">🧰 <span>口袋小站</span></a>
  <div class="nav-links">
    <a href="./">首页</a>
    <a href="tools.html">工具箱</a>
    <a href="hub.html">游戏</a>
    <a href="about.html">关于</a>
    <button class="theme-btn" type="button" aria-label="切换主题">☀️</button>
  </div>
</nav>

<header class="hero-home" style="padding-bottom:8px">
  <p class="eyebrow">MODEL CHECK</p>
  <h1>模型<em>能不能用</em></h1>
  <p class="lead">一次测一批模型：哪些能用、多快、回什么。不保存任何数据。</p>
</header>

<main class="wrap">
  <div class="box">
    <label>口令</label>
    <input id="token" type="password" placeholder="粘贴中转站口令" autocomplete="off">

    <label>要测的模型（一行一个）</label>
    <textarea id="models" rows="7">glm-4-flash
glm-4-plus
glm-4-air
glm-4-airx
glm-4-long
glm-4v
glm-4v-plus
glm-3-turbo</textarea>

    <label>测试用的提问（可改）</label>
    <input id="prompt" value="用一句话介绍你自己">

    <button id="go" type="button">开始测试</button>
    <p class="hint">模型名写错、没权限、余额不足，都会在这显示成红色失败。测完刷新即清空，不留数据。</p>
  </div>

  <div class="box" id="resultsBox" style="display:none">
    <div class="row"><span>结果</span><span id="sum"></span></div>
    <div id="list" style="margin-top:10px"></div>
  </div>
</main>

<footer><p>口袋小站 · 模型检测</p><p class="muted">不保存数据 · 刷新即清空</p></footer>

<script>
(function () {
  var ORIGIN = "https://relay.3498341186.workers.dev";
  var PROVIDER = "zhipu";
  var $ = function (id) { return document.getElementById(id); };

  function row(name) {
    var d = document.createElement("div");
    d.className = "m wait";
    d.innerHTML = '<span class="ico">⏳</span><div class="body"><div class="name"></div><div class="meta">排队中…</div><div class="txt"></div></div>';
    d.querySelector(".name").textContent = name;
    $("list").appendChild(d);
    return d;
  }

  async function testOne(name, prompt, token) {
    var el = row(name);
    var t0 = Date.now(), first = 0, chars = 0, text = "";
    try {
      var r = await fetch(ORIGIN + "/" + PROVIDER + "/chat/completions", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: "Bearer " + token, accept: "text/event-stream" },
        body: JSON.stringify({ model: name, stream: true, messages: [{ role: "user", content: prompt }], max_tokens: 40 }),
        signal: AbortSignal.timeout(45000),
      });
      if (!r.ok) {
        var b = await r.text();
        var msg = "HTTP " + r.status;
        try { var j = JSON.parse(b); if (j.error && j.error.message) msg += "：" + j.error.message; } catch (e) {}
        el.className = "m bad";
        el.querySelector(".ico").textContent = "✗";
        el.querySelector(".meta").textContent = msg.slice(0, 90);
        return false;
      }
      var reader = r.body.getReader(), dec = new TextDecoder(), buf = "";
      for (;;) {
        var x = await reader.read();
        if (x.done) break;
        buf += dec.decode(x.value, { stream: true });
        var lines = buf.split("\n"); buf = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (line.indexOf("data:") !== 0) continue;
          var data = line.slice(5).trim();
          if (!data || data === "[DONE]") continue;
          try {
            var p = JSON.parse(data);
            var d = p.choices && p.choices[0] && p.choices[0].delta && p.choices[0].delta.content;
            if (d) { if (!first) first = Date.now() - t0; chars++; text += d; }
          } catch (e) {}
        }
      }
      var total = Date.now() - t0;
      var tps = chars ? (chars / (total / 1000)).toFixed(1) : "0";
      el.className = "m ok";
      el.querySelector(".ico").textContent = "✓";
      el.querySelector(".meta").textContent = "首字 " + (first || "?") + "ms · 共 " + total + "ms · " + tps + " 字/秒";
      el.querySelector(".txt").textContent = text.slice(0, 60) || "（无内容）";
      return true;
    } catch (e) {
      el.className = "m bad";
      el.querySelector(".ico").textContent = "✗";
      el.querySelector(".meta").textContent = "失败：" + e.message.slice(0, 70);
      return false;
    }
  }

  $("go").addEventListener("click", async function () {
    var token = $("token").value.trim();
    if (!token) { alert("先粘贴口令"); return; }
    var models = $("models").value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    var prompt = $("prompt").value.trim() || "你好";
    if (!models.length) { alert("填几个模型名"); return; }

    $("go").disabled = true;
    $("go").textContent = "测试中…";
    $("resultsBox").style.display = "block";
    $("list").innerHTML = "";
    $("sum").textContent = "0 / " + models.length;

    var ok = 0;
    for (var i = 0; i < models.length; i++) {
      var good = await testOne(models[i], prompt, token);
      if (good) ok++;
      $("sum").textContent = (i + 1) + " / " + models.length + "（可用 " + ok + "）";
    }
    $("go").disabled = false;
    $("go").textContent = "再测一次";
    $("sum").textContent = "共 " + models.length + " 个 · 可用 " + ok + " 个";
  });
})();
</script>
<script src="theme.js"></script>
<script src="skin.js"></script>
</body>
</html>
