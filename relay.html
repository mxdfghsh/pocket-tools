<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>中转站检测 · 口袋小站</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
<link rel="stylesheet" href="home.css?v=15">
<link rel="stylesheet" href="theme.css?v=15">
<link rel="stylesheet" href="skins.css?v=15">
<script>try{var m=localStorage.getItem("theme")||"system";var d=m==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):m;document.documentElement.dataset.theme=d;}catch(e){}</script>
<style>
.wrap{max-width:620px;margin:0 auto;padding:0 20px}
.box{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
html[data-theme="light"] .box{background:#fff;border-color:rgba(0,0,0,.09)}
.step{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;margin-bottom:10px}
.step i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 system-ui;font-style:normal;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04121a;flex:none}
input{width:100%;font:14px var(--mono,monospace);color:var(--text);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:14px;outline:0}
html[data-theme="light"] input{background:#f8fafc;border-color:rgba(0,0,0,.12)}
input:focus{border-color:rgba(110,231,255,.5)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
#go{width:100%;margin-top:16px;padding:17px;border-radius:14px;border:0;cursor:pointer;font:800 16px/1 inherit;color:#04121a;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 14px 34px -16px rgba(110,231,255,.7)}
#go:disabled{opacity:.5}
#verdict{display:none}
.v{font-size:26px;font-weight:800;margin:0 0 6px}
.v.ok{color:#34d399}
.v.bad{color:#fb7185}
.vsub{font-size:13px;color:var(--muted);margin:0 0 16px}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.04)}
html[data-theme="light"] .item{background:#f6f8fc}
.item span:first-child{color:var(--muted)}
.item span:last-child{font-family:var(--mono,monospace);text-align:right}
#log{font:11.5px/1.6 var(--mono,monospace);color:var(--muted);white-space:pre-wrap;margin-top:12px;max-height:140px;overflow:auto}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>
<nav class="nav">
  <a class="nav-brand" href="./">🧰 <span>口袋小站</span></a>
  <div class="nav-links">
    <a href="./">首页</a>
    <a href="tools.html">工具箱</a>
    <a href="hub.html">游戏</a>
    <a href="about.html">关于</a>
    <button class="theme-btn" type="button" aria-label="切换主题">☀️</button>
  </div>
</nav>

<header class="hero-home" style="padding-bottom:8px">
  <p class="eyebrow">RELAY CHECK</p>
  <h1>中转站<em>能不能用</em></h1>
  <p class="lead">只要粘贴口令，点一下按钮。不会保存任何东西。</p>
</header>

<main class="wrap">
  <div class="box" id="form">
    <div class="step"><i>1</i> 粘贴口令</div>
    <input id="token" type="password" placeholder="例：4176679ecd20e485cbcba13fb0f1a6e089827bee" autocomplete="off">
    <p class="hint">就是之前给你的那串。填错也能测——它会告诉你口令不对。</p>
    <button id="go" type="button">开始检测</button>
    <div id="log"></div>
  </div>

  <div class="box" id="verdict">
    <p class="v" id="vTitle"></p>
    <p class="vsub" id="vSub"></p>
    <div class="items" id="items"></div>
  </div>
</main>

<footer><p>口袋小站 · 中转站检测</p><p class="muted">不保存数据 · 刷新即清空</p></footer>

<script>
(function () {
  var ORIGIN = "https://relay.3498341186.workers.dev";
  var $ = function (id) { return document.getElementById(id); };
  var log = $("log");

  function say(m) { log.textContent += ("[" + new Date().toLocaleTimeString() + "] " + m + "\n"); }
  function item(k, v) {
    var d = document.createElement("div");
    d.className = "item";
    d.innerHTML = "<span></span><span></span>";
    d.children[0].textContent = k;
    d.children[1].textContent = v;
    $("items").appendChild(d);
  }

  async function run() {
    var token = $("token").value.trim();
    var items = $("items");
    items.innerHTML = "";
    $("verdict").style.display = "none";
    log.textContent = "";
    $("go").disabled = true;
    $("go").textContent = "检测中…";

    if (!token) {
      alert("先粘贴口令再点");
      $("go").disabled = false;
      $("go").textContent = "开始检测";
      return;
    }

    var okHealth = false, provider = null;
    // 1. 健康检查
    say("检查中转站是否在线…");
    try {
      var r = await fetch(ORIGIN + "/healthz", { signal: AbortSignal.timeout(12000) });
      var j = await r.json();
      okHealth = r.ok;
      provider = j["default"] || (j.providers && Object.keys(j.providers)[0]);
      say("在线，上游：" + (j.upstream || "-"));
    } catch (e) {
      say("连不上：" + e.message);
    }

    // 2. 延迟
    var pings = [];
    say("测延迟（发 3 次小请求）…");
    for (var i = 0; i < 3; i++) {
      var t = Date.now();
      try {
        var rr = await fetch(ORIGIN + "/" + (provider || "zhipu") + "/chat/completions", {
          method: "POST",
          headers: { "content-type": "application/json", authorization: "Bearer " + token },
          body: JSON.stringify({ model: "glm-4-flash", messages: [{ role: "user", content: "hi" }], max_tokens: 1 }),
          signal: AbortSignal.timeout(30000),
        });
        var txt = await rr.text();
        if (!rr.ok) {
          var msg = "HTTP " + rr.status;
          try { var ej = JSON.parse(txt); if (ej.error && ej.error.message) msg += "：" + ej.error.message; } catch (e) {}
          say("失败 " + msg);
          show(false, "口令或地址有问题", msg, null);
          return;
        }
        pings.push(Date.now() - t);
        say("第 " + (i + 1) + " 次 " + pings[pings.length - 1] + "ms");
      } catch (e) {
        say("请求失败：" + e.message);
        show(false, "连不上中转站", "可能是没开代理，或者网络问题", null);
        return;
      }
    }
    pings.sort(function (a, b) { return a - b; });

    // 3. 测速
    say("测生成速度…");
    var first = 0, chars = 0, t0 = Date.now();
    try {
      var r2 = await fetch(ORIGIN + "/" + (provider || "zhipu") + "/chat/completions", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: "Bearer " + token, accept: "text/event-stream" },
        body: JSON.stringify({ model: "glm-4-flash", stream: true, messages: [{ role: "user", content: "用一句话介绍你自己" }], max_tokens: 80 }),
        signal: AbortSignal.timeout(60000),
      });
      if (!r2.ok) { var b2 = await r2.text(); say("测速失败 HTTP " + r2.status); show(false, "测速失败", "HTTP " + r2.status, null); return; }
      var reader = r2.body.getReader(), dec = new TextDecoder(), buf = "";
      for (;;) {
        var x = await reader.read();
        if (x.done) break;
        buf += dec.decode(x.value, { stream: true });
        var lines = buf.split("\n"); buf = lines.pop();
        for (var k = 0; k < lines.length; k++) {
          var line = lines[k].trim();
          if (line.indexOf("data:") !== 0) continue;
          var data = line.slice(5).trim();
          if (!data || data === "[DONE]") continue;
          try {
            var pj = JSON.parse(data);
            var d = pj.choices && pj.choices[0] && pj.choices[0].delta && pj.choices[0].delta.content;
            if (d) { if (!first) first = Date.now() - t0; chars++; }
          } catch (e) {}
        }
      }
    } catch (e) {
      say("测速异常：" + e.message);
    }
    var total = Date.now() - t0;
    var avg = Math.round(pings.reduce(function (a, b) { return a + b; }, 0) / pings.length);

    show(true, "能用 ✅", "中转站正常，口令有效", {
      ping: pings[0] + " ~ " + pings[pings.length - 1] + "ms",
      avg: avg + "ms",
      first: first ? first + "ms" : "—",
      speed: chars ? (chars / (total / 1000)).toFixed(1) + " 字/秒" : "—",
    });
  }

  function show(ok, title, sub, data) {
    $("verdict").style.display = "block";
    var t = $("vTitle");
    t.textContent = title;
    t.className = "v " + (ok ? "ok" : "bad");
    $("vSub").textContent = sub;
    $("items").innerHTML = "";
    if (data) {
      item("延迟范围", data.ping);
      item("平均延迟", data.avg);
      item("首字延迟", data.first);
      item("生成速度", data.speed);
      item("中转站", ORIGIN.replace("https://", ""));
    }
    $("go").disabled = false;
    $("go").textContent = "再测一次";
    $("verdict").scrollIntoView({ behavior: "smooth", block: "center" });
  }

  $("go").addEventListener("click", run);
})();
</script>
<script src="theme.js"></script>
<script src="skin.js"></script>
</body>
</html>
