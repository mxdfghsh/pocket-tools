<!DOCTYPE html>
<html>
	<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <style>
    html,body{margin:0;background:#0b0f19;color:#e8edf7;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;overflow-x:hidden}
    #canvas{display:block;width:100%;max-width:640px;margin:0 auto;image-rendering:pixelated;background:#000;touch-action:none}
    .pad{display:flex;justify-content:space-between;gap:18px;padding:14px 18px 22px;max-width:640px;margin:0 auto}
    .pad .grp{display:flex;gap:10px}
    .pad button{
      width:68px;height:68px;border-radius:50%;border:1px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.1);color:#fff;font:700 15px/1 system-ui;cursor:pointer;
      user-select:none;-webkit-user-select:none;touch-action:none;
    }
    .pad button.jump{background:rgba(251,113,133,.28)}
    .pad button.run{background:rgba(110,231,255,.22)}
    .pad button:active{background:rgba(255,255,255,.35)}
    .tip{text-align:center;font-size:12px;color:#8a95ab;padding:0 16px 18px}
  </style>
		<title>Infinite Mario - JavaScript</title>
	</head>
	<body>
		<canvas id="canvas" width="640" height="480">
			<p>Your browser does not support the canvas element.</p>
		</canvas>

        <!-- Enjine Includes -->
        <script src="Enjine/core.js"></script>

        <script src="Enjine/gameTimer.js"></script>
        <script src="Enjine/camera.js"></script>
        <script src="Enjine/drawableManager.js"></script>
        <script src="Enjine/sprite.js"></script>
        <script src="Enjine/spriteFont.js"></script>
        <script src="Enjine/frameSprite.js"></script>
        <script src="Enjine/animatedSprite.js"></script>
        <script src="Enjine/collideable.js"></script>
        <script src="Enjine/application.js"></script>

        <!-- Actual game code -->
        <script src="code/setup.js"></script>
        <script src="code/spriteCuts.js"></script>
        <script src="code/level.js"></script>
        <script src="code/backgroundGenerator.js"></script>
        <script src="code/backgroundRenderer.js"></script>
        <script src="code/improvedNoise.js"></script>
        <script src="code/notchSprite.js"></script>
        <script src="code/character.js"></script>
        <script src="code/levelRenderer.js"></script>
        <script src="code/levelGenerator.js"></script>
        <script src="code/spriteTemplate.js"></script>
        <script src="code/enemy.js"></script>
        <script src="code/fireball.js"></script>
        <script src="code/sparkle.js"></script>
        <script src="code/coinAnim.js"></script>

		<script src="code/particle.js"></script>
		<script src="code/fireFlower.js"></script>

        <script src="code/titleState.js"></script>
        <script src="code/loadingState.js"></script>

        <script src="code/winState.js"></script>

        <script src="code/music.js"></script>

        <script>document.addEventListener("DOMContentLoaded", function () { new Enjine.Application().Initialize(new Mario.LoadingState(), 320, 240); });
if (document.readyState !== "loading") { try { new Enjine.Application().Initialize(new Mario.LoadingState(), 320, 240); } catch (e) {} }</script>
	
<div class="pad">
  <div class="grp">
    <button data-k="37" type="button">◀</button>
    <button data-k="39" type="button">▶</button>
  </div>
  <div class="grp">
    <button class="run" data-k="65" type="button">跑/火</button>
    <button class="jump" data-k="83" type="button">跳</button>
  </div>
</div>
<p class="tip">← → 移动 · 跑/火 加速·发射 · 跳 跳跃（键盘：方向键 + A + S）</p>
<script>
(function () {
  function press(code, down) {
    try { Enjine.KeyboardInput.Pressed[code] = down; } catch (e) {}
  }
  document.querySelectorAll("[data-k]").forEach(function (b) {
    var code = Number(b.dataset.k);
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); press(code, true); });
    b.addEventListener("pointerup", function (e) { e.preventDefault(); press(code, false); });
    b.addEventListener("pointerleave", function () { press(code, false); });
    b.addEventListener("pointercancel", function () { press(code, false); });
    b.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  });
})();
</script>
</body>
</html>
